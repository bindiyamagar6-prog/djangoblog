{% extends "blog/base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<h1>{{ post.title }}</h1>

{% if post.category %}
  <span class="badge bg-secondary">{{ post.category.name }}</span>
{% endif %}

<p class="text-muted">{{ post.created_at|date:"M d, Y" }}</p>
<p>{{ post.content }}</p>

<div class="mt-4 d-flex gap-2">
  <a href="{% url 'post_edit' post.slug %}" class="btn btn-sm btn-outline-secondary">Edit</a>

  <form method="post" action="{% url 'post_delete' post.slug %}" onsubmit="return confirm('Delete this post?');">
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
  </form>

  <a href="{% url 'home' %}" class="btn btn-sm btn-outline-primary">&larr; Back to all posts</a>
</div>
{% endblock %}
