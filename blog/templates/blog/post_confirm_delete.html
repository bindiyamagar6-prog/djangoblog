{% extends "blog/base.html" %}
{% block title %}Delete Post{% endblock %}
{% block content %}

<div class="container my-5" style="max-width: 600px;">
  <div class="card shadow-sm">
    <div class="card-body text-center p-4">

      <h2 class="mb-3">Delete Post</h2>

      <p class="mb-1">Are you sure you want to delete</p>
      <p class="fw-bold fs-5 mb-3">"{{ object.title }}"?</p>
      <p class="text-muted small mb-4">This can't be undone.</p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center">
          <button type="submit" class="btn btn-danger px-4">Yes, delete</button>
          <a href="{% url 'post_detail' object.slug %}" class="btn btn-outline-secondary px-4">Cancel</a>
        </div>
      </form>

    </div>
  </div>
</div>

{% endblock %}
